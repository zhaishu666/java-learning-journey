<svg viewBox="0 0 680 350" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
    <title>正向代理与反向代理对比：正向代理客户端，服务器不知真实客户端；反向代理服务端，客户端不知真实后端</title>
    <desc>左侧正向代理：客户端经过代理访问服务器，服务器只看到代理。右侧反向代理：客户端访问Nginx，Nginx将请求转发给后端集群之一，客户端只看到Nginx。口诀：代理谁就代表谁。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>
    <text class="th" x="40" y="28" font-size="14" fill="#26215C">正向 vs 反向：代理谁，就代表谁</text>
    <text x="40" y="60" font-size="13" fill="#534AB7" font-weight="500">正向代理（代理客户端）</text>
    <rect x="40" y="100" width="76" height="40" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
    <text x="78" y="124" font-size="12" fill="#26215C" text-anchor="middle" font-weight="500">客户端</text>
    <g class="arr" stroke="#5F5E5A">
        <line x1="116" y1="120" x2="152" y2="120" marker-end="url(#arrow)"/>
        <line x1="238" y1="120" x2="274" y2="120" marker-end="url(#arrow)"/>
    </g>
    <rect x="152" y="100" width="86" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
    <text x="195" y="124" font-size="12" fill="#26215C" text-anchor="middle" font-weight="500">代理服务器</text>
    <rect x="274" y="100" width="76" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="312" y="124" font-size="12" fill="#2C2C2A" text-anchor="middle" font-weight="500">服务器</text>
    <text x="40" y="176" font-size="12" fill="#5F5E5A">服务器只看到代理——不知真实客户端是谁</text>
    <text x="40" y="196" font-size="12" fill="#5F5E5A">用途：公司统一出口、缓存、访问控制</text>
    <text x="360" y="60" font-size="13" fill="#0F6E56" font-weight="500">反向代理（代理服务端）</text>
    <rect x="360" y="100" width="66" height="40" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="393" y="124" font-size="12" fill="#04342C" text-anchor="middle" font-weight="500">客户端</text>
    <g class="arr" stroke="#5F5E5A">
        <line x1="426" y1="120" x2="462" y2="120" marker-end="url(#arrow)"/>
    </g>
    <rect x="462" y="100" width="80" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
    <text x="502" y="117" font-size="12" fill="#085041" text-anchor="middle" font-weight="500">Nginx</text>
    <text x="502" y="132" font-size="11" fill="#0F6E56" text-anchor="middle" font-family="monospace">proxy_pass</text>
    <g class="arr" stroke="#5F5E5A">
        <line x1="542" y1="112" x2="568" y2="86" marker-end="url(#arrow)"/>
        <line x1="542" y1="120" x2="568" y2="120" marker-end="url(#arrow)"/>
        <line x1="542" y1="128" x2="568" y2="154" marker-end="url(#arrow)"/>
    </g>
    <rect x="568" y="68" width="72" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="604" y="88" font-size="12" fill="#2C2C2A" text-anchor="middle">后端 1</text>
    <rect x="568" y="104" width="72" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="604" y="124" font-size="12" fill="#2C2C2A" text-anchor="middle">后端 2</text>
    <rect x="568" y="140" width="72" height="32" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="604" y="160" font-size="12" fill="#2C2C2A" text-anchor="middle">后端 3</text>
    <text x="360" y="196" font-size="12" fill="#5F5E5A">客户端只知道 Nginx——不知请求给了哪台后端（默认轮询）</text>
    <text x="360" y="176" font-size="12" fill="#5F5E5A">server 定虚拟主机 · location 定路径 · proxy_pass 转发</text>
    <rect x="40" y="230" width="600" height="76" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="58" y="256" font-size="13" fill="#633806" font-weight="500">今天 P79 场景里的它：前端静态页面部署在 Nginx（80），后端在 8080</text>
    <text x="58" y="280" font-size="12" fill="#2C2C2A">浏览器只访问 Nginx 一个域 → 接口请求经反代转给后端 → 顺带解决了前后端跨域（同源策略）</text>
    <text x="58" y="298" font-size="12" fill="#854F0B">口诀：正向代理是客户端的替身，反向代理是服务端的替身</text>
</svg>