<svg viewBox="0 0 680 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>redo log 循环写：write pos 与 checkpoint 双指针模型</title>
<desc>环形redo log文件，checkpoint到write pos为已写入未刷盘的脏日志，write pos绕一圈追上checkpoint即写满触发强制刷脏</desc>
<defs>
<marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<path d="M 143.4 93.4 A 80 80 0 1 1 256.6 206.6" fill="none" stroke="#BA7517" stroke-width="22"/>
<path d="M 256.6 206.6 A 80 80 0 1 1 143.4 93.4" fill="none" stroke="#5DCAA5" stroke-width="22"/>
<circle cx="200" cy="150" r="80" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="200" y="145" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">redo log</text>
<text x="200" y="163" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">固定大小 · 循环写</text>
<path d="M95 95 L132 118" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#a8)"/>
<text x="42" y="85" font-size="13" font-weight="500" fill="#854F0B">checkpoint</text>
<text x="42" y="103" font-size="11" fill="#5F5E5A">已刷盘 · 可被覆盖</text>
<path d="M310 210 L265 190" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#a8)"/>
<text x="318" y="215" font-size="13" font-weight="500" fill="#0F6E56">write pos</text>
<text x="318" y="233" font-size="11" fill="#5F5E5A">当前写入位置</text>
<path d="M230 70 A 62 62 0 0 1 258 92" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a8)"/>
<text x="240" y="56" font-size="11" fill="#993C1D">两指针同向推进</text>
<rect x="360" y="60" width="290" height="110" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="375" y="85" font-size="12" font-weight="500" fill="#854F0B">橙色区：已写入未刷盘</text>
<text x="375" y="104" font-size="11" fill="#444441">对应脏页还在 Buffer Pool，崩溃恢复</text>
<text x="375" y="120" font-size="11" fill="#444441">全靠这段日志，绝不能覆盖</text>
<text x="375" y="146" font-size="12" font-weight="500" fill="#0F6E56">绿色区：对应脏页已落盘</text>
<text x="375" y="162" font-size="11" fill="#444441">日志使命已完成 → 空闲，可写新日志</text>
<rect x="360" y="190" width="290" height="170" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="375" y="215" font-size="12" font-weight="500" fill="#A32D2D">写满瞬间（你说的"写慢"应为"写满"）</text>
<text x="375" y="238" font-size="11" fill="#444441">write pos 绕一圈追上 checkpoint：</text>
<text x="375" y="256" font-size="11" fill="#444441">必须立刻强制推进 checkpoint（刷脏页），</text>
<text x="375" y="274" font-size="11" fill="#444441">期间所有更新请求挂起等待</text>
<text x="375" y="298" font-size="11" fill="#444441">→ 用户感受到的就是响应骤降的尖刺</text>
<text x="375" y="322" font-size="11" fill="#5F5E5A">所以 innodb_log_file_size 不能设太小，</text>
<text x="375" y="340" font-size="11" fill="#5F5E5A">太小 = checkpoint 太频繁 = 长期卡顿</text>
</svg>