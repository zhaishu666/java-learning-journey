<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <defs>
        <marker id="ia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
        </marker>
    </defs>
    <rect width="680" height="500" fill="#ffffff"/>
    <text x="24" y="30" font-size="15" font-weight="700" fill="#24292f">new Child() 时到底发生什么：完整六步</text>
    <text x="24" y="52" font-size="11.5" fill="#a12622">你排错的一步：④ 实例字段/实例块在构造器体之前 —— 构造器体可能用到字段，字段必须先就位</text>

    <rect x="24" y="72" width="330" height="44" rx="8" fill="#f6f8fa" stroke="#8b949e"/>
    <text x="60" y="90" font-size="12" font-weight="700" fill="#24292f">① 父类静态字段 + 静态块</text>
    <text x="60" y="108" font-size="10" fill="#57606a">只在首次加载类时执行一次</text>

    <line x1="189" y1="116" x2="189" y2="138" stroke="#57606a" stroke-width="1.6" marker-end="url(#ia)"/>

    <rect x="24" y="140" width="330" height="44" rx="8" fill="#f6f8fa" stroke="#8b949e"/>
    <text x="60" y="158" font-size="12" font-weight="700" fill="#24292f">② 子类静态字段 + 静态块</text>
    <text x="60" y="176" font-size="10" fill="#57606a">同上，类加载期，一次</text>

    <line x1="189" y1="184" x2="189" y2="206" stroke="#57606a" stroke-width="1.6" marker-end="url(#ia)"/>
    <text x="200" y="200" font-size="10" fill="#57606a">每次 new 都从③开始重复</text>

    <rect x="24" y="208" width="330" height="44" rx="8" fill="#fff8e5" stroke="#d9730d"/>
    <text x="60" y="226" font-size="12" font-weight="700" fill="#8a4b00">③ 父类实例字段 + 实例块（按源码顺序）</text>
    <text x="60" y="244" font-size="10" fill="#8a4b00">字段先就位，构造器体才有东西可用</text>

    <line x1="189" y1="252" x2="189" y2="274" stroke="#57606a" stroke-width="1.6" marker-end="url(#ia)"/>

    <rect x="24" y="276" width="330" height="44" rx="8" fill="#fff8e5" stroke="#d9730d"/>
    <text x="60" y="294" font-size="12" font-weight="700" fill="#8a4b00">④ 父类构造器体</text>
    <text x="60" y="312" font-size="10" fill="#8a4b00">子类构造器第一行隐式 super()，先有父才有子</text>

    <line x1="189" y1="320" x2="189" y2="342" stroke="#57606a" stroke-width="1.6" marker-end="url(#ia)"/>

    <rect x="24" y="344" width="330" height="44" rx="8" fill="#eef4ff" stroke="#3370ff"/>
    <text x="60" y="362" font-size="12" font-weight="700" fill="#1f4fd8">⑤ 子类实例字段 + 实例块（按源码顺序）</text>
    <text x="60" y="380" font-size="10" fill="#1f4fd8">同理：先字段后构造器体</text>

    <line x1="189" y1="388" x2="189" y2="410" stroke="#57606a" stroke-width="1.6" marker-end="url(#ia)"/>

    <rect x="24" y="412" width="330" height="44" rx="8" fill="#eef4ff" stroke="#3370ff"/>
    <text x="60" y="430" font-size="12" font-weight="700" fill="#1f4fd8">⑥ 子类构造器体</text>
    <text x="60" y="448" font-size="10" fill="#1f4fd8">至此对象可用</text>

    <rect x="384" y="72" width="272" height="384" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="402" y="100" font-size="13" font-weight="700" fill="#24292f">你问：为什么这样设计？</text>
    <text x="402" y="128" font-size="11.5" font-weight="700" fill="#116326">① 静态先于实例：</text>
    <text x="402" y="146" font-size="11" fill="#24292f">静态属于类，类加载一次、全类共享，</text>
    <text x="402" y="162" font-size="11" fill="#24292f">必须在使用前就绪；实例属于每次 new</text>
    <text x="402" y="178" font-size="11" fill="#24292f">出来的对象，跟着对象走</text>
    <text x="402" y="206" font-size="11.5" font-weight="700" fill="#116326">② 父类先于子类：</text>
    <text x="402" y="224" font-size="11" fill="#24292f">子类的初始化逻辑可能依赖父类的字段，</text>
    <text x="402" y="240" font-size="11" fill="#24292f">所以父类必须先构造完（隐式 super()）</text>
    <text x="402" y="268" font-size="11.5" font-weight="700" fill="#116326">③ 字段先于构造器体：</text>
    <text x="402" y="286" font-size="11" fill="#24292f">构造器体里可能直接读字段，字段没就位</text>
    <text x="402" y="302" font-size="11" fill="#24292f">读到的是默认值——经典 bug 来源</text>
    <text x="402" y="336" font-size="11" fill="#a12622">两个补充考点：</text>
    <text x="402" y="356" font-size="11" fill="#24292f">▪ 静态块与静态字段按【源码顺序】执行，</text>
    <text x="402" y="372" font-size="11" fill="#24292f">  谁写在前面谁先跑（考试陷阱）</text>
    <text x="402" y="396" font-size="11" fill="#24292f">▪ 你的口诀「静态优于实例，父类优于子类」</text>
    <text x="402" y="412" font-size="11" fill="#24292f">  保持有效，但要补第三句：</text>
    <text x="402" y="430" font-size="11" font-weight="700" fill="#a12622">  「字段先于构造器体」</text>
    <text x="402" y="450" font-size="10.5" fill="#57606a">联动 Day 27：静态部分=类加载阶段（双亲委派那课）</text>
</svg>