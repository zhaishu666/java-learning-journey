<svg viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="0" y="0" width="680" height="300" fill="#ffffff"/>
    <text x="20" y="28" font-size="14" font-weight="bold" fill="#1f2328">先更新库、再删缓存 ≠ 绝对安全：低概率竞态（面试必追问）</text>

    <!-- lanes -->
    <text x="90" y="62" font-size="12" font-weight="bold" fill="#0969da" text-anchor="end">读线程 R</text>
    <text x="90" y="132" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="end">写线程 W</text>
    <line x1="105" y1="66" x2="640" y2="66" stroke="#d0d5dd" stroke-width="1.5"/>
    <line x1="105" y1="136" x2="640" y2="136" stroke="#d0d5dd" stroke-width="1.5"/>

    <!-- R steps -->
    <rect x="110" y="48" width="120" height="26" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="170" y="65" font-size="11" fill="#0969da" text-anchor="middle">① 查缓存 → 未命中</text>
    <rect x="250" y="48" width="130" height="26" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="315" y="65" font-size="11" fill="#0969da" text-anchor="middle">② 查库 → 读到旧值 10</text>
    <rect x="520" y="48" width="115" height="26" rx="6" fill="#ffebe9" stroke="#cf222e"/>
    <text x="577" y="65" font-size="11" fill="#cf222e" text-anchor="middle">④ 回填旧值 10 ✗</text>
    <path d="M380,61 C440,61 470,61 518,61" stroke="#0969da" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>

    <!-- W steps -->
    <rect x="380" y="118" width="120" height="26" rx="6" fill="#ffebe9" stroke="#cf222e"/>
    <text x="440" y="135" font-size="11" fill="#cf222e" text-anchor="middle">②' 更新库为 20</text>
    <rect x="440" y="175" width="110" height="26" rx="6" fill="#ffebe9" stroke="#cf222e"/>
    <text x="495" y="192" font-size="11" fill="#cf222e" text-anchor="middle">③ 删缓存</text>
    <path d="M440,118 C440,100 470,84 492,80" stroke="#8b949e" stroke-width="1.2" fill="none" marker-end=""/>

    <!-- annotation -->
    <rect x="110" y="225" width="525" height="60" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="372" y="248" font-size="11.5" fill="#57606a" text-anchor="middle">①在②'前、④在③后——读线程的"查库旧值"跨过了写线程全程，</text>
    <text x="372" y="266" font-size="11.5" fill="#57606a" text-anchor="middle">删缓存删了个寂寞，旧值照样被回填。概率极低（要求读比写慢），但存在</text>
</svg>