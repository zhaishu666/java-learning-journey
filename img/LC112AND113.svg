<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <defs>
        <marker id="ka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
        </marker>
    </defs>
    <rect width="680" height="470" fill="#ffffff"/>
    <text x="24" y="30" font-size="15" font-weight="700" fill="#24292f">为什么 112 不用回溯、113 必须 remove？—— 一个参数传递差异</text>

    <!-- Panel 112 -->
    <rect x="24" y="56" width="310" height="330" rx="10" fill="#eaf7ee" stroke="#2ea44f"/>
    <text x="44" y="82" font-size="13" font-weight="700" fill="#116326">LC112：targetSum 是 int（按值传）</text>
    <text x="44" y="102" font-size="10.5" fill="#116326">每层栈帧拿到自己的副本，互不干扰</text>

    <rect x="52" y="118" width="254" height="44" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="70" y="136" font-size="10.5" fill="#24292f">dfs(节点5, rem=10) → 副本算出 rem=5</text>
    <text x="70" y="152" font-size="10" fill="#57606a">自己的 5，别人动不了</text>

    <line x1="179" y1="162" x2="179" y2="180" stroke="#57606a" stroke-width="1.5" marker-end="url(#ka)"/>

    <rect x="52" y="182" width="254" height="44" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="70" y="200" font-size="10.5" fill="#24292f">dfs(节点3, rem=5) → 副本算出 rem=2</text>
    <text x="70" y="216" font-size="10" fill="#57606a">上一层帧里的 5 原封不动</text>

    <line x1="179" y1="226" x2="179" y2="244" stroke="#57606a" stroke-width="1.5" marker-end="url(#ka)"/>

    <rect x="52" y="246" width="254" height="44" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="70" y="264" font-size="10.5" fill="#24292f">dfs(叶子2, rem=2) → rem=0 ✓</text>
    <text x="70" y="280" font-size="10" fill="#57606a">帧销毁，副本自动消失</text>

    <rect x="52" y="304" width="254" height="66" rx="6" fill="#eaf7ee" stroke="#2ea44f"/>
    <text x="179" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#116326">函数返回 = 栈帧销毁 = 副本蒸发</text>
    <text x="179" y="350" text-anchor="middle" font-size="11" fill="#116326">「回溯」是免费的——值传递自带副本</text>

    <!-- Panel 113 -->
    <rect x="356" y="56" width="300" height="330" rx="10" fill="#fff8e5" stroke="#d9730d"/>
    <text x="376" y="82" font-size="13" font-weight="700" fill="#8a4b00">LC113：path 是 ArrayList（按引用传）</text>
    <text x="376" y="102" font-size="10.5" fill="#8a4b00">所有栈帧指向堆里同一个对象</text>

    <rect x="384" y="118" width="120" height="36" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="444" y="141" text-anchor="middle" font-size="10.5" fill="#24292f">帧A: 进入 add(5)</text>
    <rect x="384" y="168" width="120" height="36" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="444" y="191" text-anchor="middle" font-size="10.5" fill="#24292f">帧B: 进入 add(3)</text>
    <rect x="384" y="218" width="120" height="36" rx="6" fill="#ffffff" stroke="#8b949e"/>
    <text x="444" y="241" text-anchor="middle" font-size="10.5" fill="#24292f">帧C: 进入 add(2)</text>

    <line x1="504" y1="136" x2="580" y2="196" stroke="#d9730d" stroke-width="1.4" marker-end="url(#ka)"/>
    <line x1="504" y1="186" x2="580" y2="196" stroke="#d9730d" stroke-width="1.4" marker-end="url(#ka)"/>
    <line x1="504" y1="236" x2="580" y2="198" stroke="#d9730d" stroke-width="1.4" marker-end="url(#ka)"/>

    <rect x="582" y="170" width="56" height="56" rx="6" fill="#fff4e5" stroke="#d9730d" stroke-width="1.6"/>
    <text x="610" y="192" text-anchor="middle" font-size="9.5" fill="#8a4b00">堆:path</text>
    <text x="610" y="208" text-anchor="middle" font-size="10" font-weight="700" fill="#8a4b00">[5,3,2]</text>
    <text x="610" y="234" text-anchor="middle" font-size="9" fill="#8a4b00">全树共享一份</text>

    <rect x="384" y="288" width="254" height="82" rx="6" fill="#fff8e5" stroke="#d9730d"/>
    <text x="511" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#8a4b00">进入帧：add(x)　退出帧：remove(最后)</text>
    <text x="511" y="330" text-anchor="middle" font-size="10.5" fill="#8a4b00">不 remove → 姐妹分支带着别人的节点跑</text>
    <text x="511" y="352" text-anchor="middle" font-size="10.5" fill="#8a4b00">res.add(new ArrayList&lt;&gt;(path)) = 拷贝快照</text>

    <!-- Principle bar -->
    <rect x="24" y="404" width="632" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="340" y="426" text-anchor="middle" font-size="11.5" font-weight="700" fill="#24292f">原则：值类型参数每层自带副本，天然回溯；引用类型参数全树共享一份，撤销必须手写</text>
    <text x="340" y="444" text-anchor="middle" font-size="10.5" fill="#57606a">「选择 → 递归 → 撤销」三件套里的撤销，只服务于共享状态——这就是回溯模板存在的全部理由</text>
</svg>