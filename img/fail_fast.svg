<svg viewBox="0 0 680 445" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="680" height="445" fill="#ffffff" rx="12"/>
    <text x="24" y="30" font-size="15" font-weight="bold" fill="#111827">fail-fast 的检查点：在 next() 里，不在 hasNext() 里</text>
    <text x="24" y="48" font-size="11" fill="#6b7280">一个不抛异常、但悄悄漏遍历的边界案例</text>

    <rect x="40" y="68" width="210" height="112" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="145" y="92" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">ArrayList</text>
    <text x="56" y="116" font-size="11" fill="#374151">modCount = 1（结构修改次数）</text>
    <text x="56" y="138" font-size="11" fill="#374151">list.remove("b") 之后：</text>
    <text x="56" y="160" font-size="12" fill="#dc2626" font-weight="bold">modCount = 2</text>

    <line x1="250" y1="124" x2="292" y2="124" stroke="#6b7280" stroke-width="1.5" marker-end="url(#a1)"/>
    <defs><marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#6b7280"/></marker></defs>
    <text x="271" y="112" font-size="10" fill="#6b7280" text-anchor="middle">集合直接改</text>

    <rect x="292" y="68" width="220" height="112" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="402" y="92" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">迭代器 Itr（增强for底层）</text>
    <text x="308" y="116" font-size="11" fill="#374151">expectedModCount = 1（创建时抄下）</text>
    <text x="308" y="138" font-size="11" fill="#374151">next() 开头先检查两者相等</text>
    <text x="308" y="160" font-size="11" fill="#374151">iterator.remove() 会重新同步</text>

    <rect x="532" y="80" width="128" height="88" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="596" y="108" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">next() 发现 1 ≠ 2</text>
    <text x="596" y="130" font-size="10" fill="#dc2626" text-anchor="middle">抛</text>
    <text x="596" y="148" font-size="9.5" fill="#dc2626" text-anchor="middle">ConcurrentModification</text>
    <text x="596" y="161" font-size="9.5" fill="#dc2626" text-anchor="middle">Exception</text>

    <text x="24" y="216" font-size="13" font-weight="bold" fill="#111827">漏网之鱼：增强for里删除「倒数第二个」元素</text>
    <text x="24" y="236" font-size="11" fill="#6b7280">list = [a, b, c]，循环中删除 "b"（三个元素中的第二个 = 倒数第一个的前一个）</text>

    <rect x="40" y="252" width="185" height="130" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="132" y="278" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">① 第 2 轮循环</text>
    <text x="56" y="302" font-size="10.5" fill="#374151">next() 返回 "b"</text>
    <text x="56" y="320" font-size="10.5" fill="#374151">cursor: 1 → 2</text>
    <text x="56" y="338" font-size="10.5" fill="#374151">list.remove("b")</text>
    <text x="56" y="356" font-size="10.5" fill="#dc2626">size: 3 → 2, modCount++</text>

    <rect x="248" y="252" width="185" height="130" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="340" y="278" font-size="11" font-weight="bold" fill="#374151" text-anchor="middle">② 第 3 轮判断</text>
    <text x="264" y="302" font-size="10.5" fill="#374151">hasNext():</text>
    <text x="264" y="320" font-size="10.5" fill="#374151">cursor(2) != size(2)</text>
    <text x="264" y="338" font-size="10.5" fill="#dc2626" font-weight="bold">2 == 2 → false</text>
    <text x="264" y="356" font-size="10.5" fill="#6b7280">检查只活在 next() 里</text>

    <rect x="456" y="252" width="185" height="130" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="548" y="278" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">③ 结果</text>
    <text x="472" y="302" font-size="10.5" fill="#92400e">循环静默结束</text>
    <text x="472" y="320" font-size="10.5" fill="#dc2626" font-weight="bold">"c" 从未被访问</text>
    <text x="472" y="338" font-size="10.5" fill="#dc2626" font-weight="bold">一次异常都没抛</text>
    <text x="472" y="356" font-size="10.5" fill="#92400e">无感知的数据漏处理</text>

    <text x="24" y="424" font-size="11" fill="#6b7280">教训：删「倒数第二个」时 cursor 恰好撞上缩小后的 size，hasNext() 直接判假收工——fail-fast 该抛的时候也可能不抛</text>
</svg>