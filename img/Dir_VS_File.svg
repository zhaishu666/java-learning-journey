<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
    <title>Linux目录与文件权限分工、删除文件权限链与sticky位机制</title>
    <desc>目录权限r=ls列出文件名、w=增删重命名条目、x=cd穿越；文件权限r=cat读内容、w=改内容、x=执行。删除文件只查父目录w+x，与文件自身权限无关。sticky位chmod 1777使drwxrwxrwt目录下仅目录属主、文件属主、root可删除。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>
    <text class="th" x="40" y="28" font-size="14" fill="#26215C">目录 vs 文件 · 权限各管什么</text>
    <rect x="40" y="46" width="290" height="122" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="58" y="70" font-size="13" fill="#0C447C" font-weight="500">目录 = 名字的容器</text>
    <g font-family="monospace" font-size="13" fill="#0C447C" font-weight="500">
        <text x="58" y="98">r</text>
        <text x="58" y="122">w</text>
        <text x="58" y="146">x</text>
    </g>
    <g font-size="12" fill="#2C2C2A">
        <text x="82" y="98">ls 列出文件名（无 x 时只有名字没属性）</text>
        <text x="82" y="122">创建 / 删除 / 重命名条目（需配 x）</text>
        <text x="82" y="146">cd 进入、穿越路径、读条目属性</text>
    </g>
    <rect x="350" y="46" width="290" height="122" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="368" y="70" font-size="13" fill="#085041" font-weight="500">文件 = 内容的载体</text>
    <g font-family="monospace" font-size="13" fill="#085041" font-weight="500">
        <text x="368" y="98">r</text>
        <text x="368" y="122">w</text>
        <text x="368" y="146">x</text>
    </g>
    <g font-size="12" fill="#2C2C2A">
        <text x="392" y="98">cat 读取内容</text>
        <text x="392" y="122">修改内容</text>
        <text x="392" y="146">执行</text>
    </g>
    <text x="368" y="70"></text>
    <text class="th" x="40" y="206" font-size="14" fill="#26215C">删除一个文件，权限查的是谁？</text>
    <g class="arr" stroke="#5F5E5A">
        <line x1="180" y1="238" x2="215" y2="238" marker-end="url(#arrow)"/>
        <line x1="435" y1="238" x2="470" y2="238" marker-end="url(#arrow)"/>
    </g>
    <rect x="40" y="216" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="110" y="242" font-size="13" fill="#2C2C2A" text-anchor="middle" font-family="monospace">rm file.txt</text>
    <rect x="215" y="216" width="220" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <text x="325" y="235" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500">只查父目录的 w + x</text>
    <text x="325" y="252" font-size="11" fill="#185FA5" text-anchor="middle">删的是目录条目，不碰文件</text>
    <rect x="470" y="216" width="170" height="44" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
    <text x="555" y="235" font-size="13" fill="#712B13" text-anchor="middle" font-weight="500">文件自身权限无关</text>
    <text x="555" y="252" font-size="11" fill="#993C1D" text-anchor="middle">文件 000 也照删不误</text>
    <rect x="40" y="290" width="600" height="110" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="58" y="316" font-size="13" fill="#633806" font-weight="500">sticky 位 = 在"删除只看父目录"之上打的补丁</text>
    <text x="58" y="340" font-size="12" fill="#2C2C2A">/tmp 是 1777（= 777 + t）→ drwxrwxrwt：目录对所有人开放 w+x，意味着人人可删任何文件</text>
    <text x="58" y="362" font-size="12" fill="#2C2C2A">chmod +t 之后：只有 目录属主 / 文件属主 / root 能删 —— 若删除真需要文件自身的 w，sticky 就没有存在的必要了</text>
    <text x="58" y="386" font-size="12" fill="#854F0B" font-family="monospace">场景：多人共享目录 /tmp —— 各写各的，互删被禁止</text>
</svg>