<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <defs>
        <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
        </marker>
    </defs>
    <rect width="680" height="490" fill="#ffffff"/>
    <text x="24" y="30" font-size="15" font-weight="700" fill="#24292f">中文字符串从指尖到落盘，要过三道编码关卡</text>
    <text x="24" y="52" font-size="11.5" fill="#57606a">乱码的定位方法：三层各查一遍——任何一层「编码器」和「解码器」不一致，就乱</text>

    <!-- Layer 1: stdin -->
    <rect x="24" y="76" width="632" height="100" rx="10" fill="#fff8e5" stroke="#d9730d"/>
    <text x="44" y="102" font-size="13" font-weight="700" fill="#8a4b00">关卡① 控制台 → 程序（stdin 解码）</text>
    <text x="44" y="126" font-size="11" fill="#24292f">你敲的字 → 终端编码成字节 → 程序按某编码解码成 String。IDEA 终端默认 UTF-8 字节，</text>
    <text x="44" y="146" font-size="11" fill="#24292f">但中文 Windows + JDK17 的默认平台编码是 GBK —— 解码器不匹配，字符在这里就已经死了</text>
    <text x="44" y="166" font-size="11" font-weight="700" fill="#a12622">你的诊断「按 GBK 解码」= 这一层坏了 → 修复：读输入时显式 UTF-8</text>

    <line x1="340" y1="176" x2="340" y2="204" stroke="#57606a" stroke-width="1.8" marker-end="url(#ca)"/>

    <!-- Layer 2: memory -->
    <rect x="24" y="206" width="632" height="86" rx="10" fill="#eaf7ee" stroke="#2ea44f"/>
    <text x="44" y="232" font-size="13" font-weight="700" fill="#116326">内存中的 String（Unicode，永远不乱码）</text>
    <text x="44" y="256" font-size="11" fill="#24292f">String 在 JVM 里是字符（char/Unicode 码点），本身没有「编码」概念——</text>
    <text x="44" y="276" font-size="11" fill="#24292f">乱码一定是「进内存前解码错」或「出内存时编码错」，内存只是受害者</text>

    <line x1="340" y1="292" x2="340" y2="320" stroke="#57606a" stroke-width="1.8" marker-end="url(#ca)"/>

    <!-- Layer 3: file -->
    <rect x="24" y="322" width="632" height="100" rx="10" fill="#eef4ff" stroke="#3370ff"/>
    <text x="44" y="348" font-size="13" font-weight="700" fill="#1f4fd8">关卡② 程序 → 文件（写盘编码）+ 关卡③ 文件 → 眼睛（查看器编码）</text>
    <text x="44" y="372" font-size="11" fill="#24292f">Files.write 不指定字符集 = 用平台默认（中文 Windows + JDK17 = GBK）；IDEA 打开文件猜错编码也会「假乱码」</text>
    <text x="44" y="392" font-size="11" fill="#24292f">判断方法：右下角看编码；换 UTF-8 重新打开——真乱码换编码也没救，假乱码一换就回来</text>
    <text x="44" y="412" font-size="11" font-weight="700" fill="#1f4fd8">先确认 books.tsv 是哪一种，再决定修哪层</text>

    <rect x="24" y="436" width="632" height="38" rx="8" fill="#fdeaea" stroke="#c0392b"/>
    <text x="44" y="460" font-size="11.5" font-weight="700" fill="#a12622">修复 = 三处全部显式钉死 UTF-8（不靠检测，靠约定）：读 stdin 指定 UTF-8 + 写文件指定 UTF-8 + 顺手加中文测试用例 → 一个 fix commit</text>
</svg>