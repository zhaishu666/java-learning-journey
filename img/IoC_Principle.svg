<svg viewBox="0 0 680 380" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
    <title>三层架构与IoC容器：新旧世界对象创建控制权对比</title>
    <desc>左侧旧世界Controller内部new Service、Service内部new Dao，编译期绑死难以替换；右侧IoC容器通过ComponentScan扫描注册三个Bean，Controller调用Service调用Dao，Autowired在字段处注入依赖，Dao访问数据库。控制权在容器手里意味着运行期可替换实现。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>
    <text class="th" x="40" y="28" font-size="14" fill="#26215C">三层架构 × IoC 容器：谁创建对象，控制权就在谁手里</text>
    <rect x="40" y="60" width="200" height="250" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="58" y="86" font-size="13" fill="#712B13" font-weight="500">旧世界：自己 new</text>
    <g font-size="12" font-family="monospace" fill="#4A1B0C">
        <text x="58" y="118">Controller {</text>
        <text x="58" y="140">  Service s =</text>
        <text x="58" y="162">    new Service();</text>
        <text x="58" y="184">}</text>
    </g>
    <text x="58" y="216" font-size="12" fill="#712B13">编译期绑死</text>
    <text x="58" y="238" font-size="12" fill="#712B13">换实现 = 改源码</text>
    <text x="58" y="260" font-size="12" fill="#712B13">单测难塞 mock</text>
    <rect x="270" y="60" width="380" height="186" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="286" y="86" font-size="13" fill="#0C447C" font-weight="500">IoC 容器（@ComponentScan 扫描注册）</text>
    <g font-size="11" fill="#185FA5" font-family="monospace">
        <text x="286" y="104">@Controller / @Service / @Repository</text>
    </g>
    <g class="arr" stroke="#5F5E5A">
        <line x1="372" y1="160" x2="418" y2="160" marker-end="url(#arrow)"/>
        <line x1="522" y1="160" x2="568" y2="160" marker-end="url(#arrow)"/>
    </g>
    <g font-size="11" fill="#0C447C" font-family="monospace" text-anchor="middle">
        <text x="395" y="150">@Autowired</text>
        <text x="545" y="150">@Autowired</text>
    </g>
    <rect x="290" y="138" width="82" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <text x="331" y="165" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="monospace">Controller</text>
    <text x="331" y="196" font-size="11" fill="#185FA5" text-anchor="middle" font-family="monospace">bean: controller</text>
    <rect x="440" y="138" width="82" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <text x="481" y="165" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="monospace">Service</text>
    <text x="481" y="196" font-size="11" fill="#185FA5" text-anchor="middle" font-family="monospace">bean: service</text>
    <rect x="570" y="138" width="62" height="44" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
    <text x="601" y="165" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="500" font-family="monospace">Dao</text>
    <text x="601" y="196" font-size="11" fill="#185FA5" text-anchor="middle" font-family="monospace">bean: dao</text>
    <g class="arr" stroke="#5F5E5A">
        <line x1="340" y1="100" x2="331" y2="134" marker-end="url(#arrow)"/>
    </g>
    <text x="290" y="98" font-size="12" fill="#444441">HTTP 请求</text>
    <g class="arr" stroke="#5F5E5A">
        <line x1="601" y1="186" x2="601" y2="240" marker-end="url(#arrow)"/>
    </g>
    <ellipse cx="601" cy="268" rx="34" ry="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <rect x="567" y="268" width="68" height="28" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <ellipse cx="601" cy="296" rx="34" ry="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="640" y="272" font-size="11" fill="#5F5E5A">DB</text>
    <rect x="40" y="330" width="600" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="56" y="352" font-size="12" fill="#085041">IoC 的价值一句话：对象创建与使用分离 → 运行期可替换实现 —— 单测塞 mock 靠的就是这一条</text>
</svg>