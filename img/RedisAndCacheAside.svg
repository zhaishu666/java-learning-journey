<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Microsoft YaHei, sans-serif">
    <defs>
        <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#57606a"/></marker>
    </defs>
    <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>

    <!-- 左：客户端分层 -->
    <rect x="20" y="45" width="280" height="330" rx="10" fill="#f6f8fa" stroke="#d0d5dd"/>
    <text x="160" y="70" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">Redis 客户端分层</text>
    <rect x="45" y="85" width="230" height="30" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="160" y="104" font-size="12.5" fill="#1f2328" text-anchor="middle">Java 应用（Spring Boot）</text>
    <line x1="160" y1="115" x2="160" y2="131" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="45" y="133" width="230" height="42" rx="6" fill="#ddf4ff" stroke="#0969da"/>
    <text x="160" y="151" font-size="12.5" font-weight="bold" fill="#0969da" text-anchor="middle">SpringDataRedis · RedisTemplate</text>
    <text x="160" y="168" font-size="10.5" fill="#57606a" text-anchor="middle">统一 API · 序列化 · 屏蔽底层客户端差异</text>
    <line x1="100" y1="175" x2="100" y2="193" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="220" y1="175" x2="220" y2="193" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="45" y="195" width="105" height="64" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="97" y="213" font-size="12" font-weight="bold" fill="#9a6700" text-anchor="middle">Jedis</text>
    <text x="97" y="230" font-size="10" fill="#57606a" text-anchor="middle">方法名=Redis命令</text>
    <text x="97" y="246" font-size="10" fill="#57606a" text-anchor="middle">线程不安全·需池化</text>
    <rect x="170" y="195" width="105" height="64" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="222" y="213" font-size="12" font-weight="bold" fill="#1a7f37" text-anchor="middle">Lettuce</text>
    <text x="222" y="230" font-size="10" fill="#57606a" text-anchor="middle">Netty·线程安全</text>
    <text x="222" y="246" font-size="10" fill="#57606a" text-anchor="middle">Boot 默认</text>
    <line x1="97" y1="259" x2="97" y2="275" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="222" y1="259" x2="222" y2="275" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="45" y="277" width="230" height="30" rx="6" fill="#f6f0ff" stroke="#8250df"/>
    <text x="160" y="296" font-size="12.5" font-weight="bold" fill="#8250df" text-anchor="middle">Redis 服务器</text>
    <text x="160" y="327" font-size="10.5" fill="#8b949e" text-anchor="middle">面试点：Jedis 实例线程不安全 → 必须连接池</text>
    <text x="160" y="345" font-size="10.5" fill="#8b949e" text-anchor="middle">序列化坑：默认 JDK 序列化 → key 乱码（阶段五踩）</text>

    <!-- 右：Cache Aside 模型 -->
    <rect x="320" y="45" width="340" height="330" rx="10" fill="#f6f8fa" stroke="#d0d5dd"/>
    <text x="490" y="70" font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle">缓存工作模型（Cache Aside）</text>
    <text x="490" y="92" font-size="12" font-weight="bold" fill="#1a7f37" text-anchor="middle">读路径 ✓ 你今天答对的</text>

    <rect x="333" y="102" width="42" height="26" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="354" y="119" font-size="11.5" fill="#1f2328" text-anchor="middle">请求</text>
    <line x1="375" y1="115" x2="393" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="395" y="102" width="54" height="26" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="422" y="119" font-size="11.5" fill="#1f2328" text-anchor="middle">查缓存</text>
    <line x1="449" y1="115" x2="493" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="471" y="109" font-size="9.5" fill="#1a7f37" text-anchor="middle">命中</text>
    <rect x="495" y="102" width="44" height="26" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="517" y="119" font-size="11.5" fill="#1a7f37" text-anchor="middle">返回</text>
    <line x1="422" y1="128" x2="422" y2="144" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="430" y="140" font-size="9.5" fill="#9a6700">未命中</text>

    <rect x="395" y="146" width="54" height="26" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="422" y="163" font-size="11" fill="#1f2328" text-anchor="middle">查数据库</text>
    <line x1="449" y1="159" x2="493" y2="159" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="471" y="153" font-size="9.5" fill="#8b949e" text-anchor="middle">不存在</text>
    <rect x="495" y="146" width="62" height="26" rx="6" fill="#f6f8fa" stroke="#8b949e" stroke-dasharray="3,3"/>
    <text x="526" y="163" font-size="11" fill="#8b949e" text-anchor="middle">返回错误</text>
    <line x1="422" y1="172" x2="422" y2="187" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="430" y="183" font-size="9.5" fill="#1a7f37">存在</text>

    <rect x="360" y="189" width="124" height="26" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="422" y="206" font-size="11" fill="#9a6700" text-anchor="middle">回写缓存 · 设 TTL</text>
    <line x1="484" y1="202" x2="493" y2="202" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="495" y="189" width="44" height="26" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="517" y="206" font-size="11.5" fill="#1a7f37" text-anchor="middle">返回</text>
    <text x="570" y="206" font-size="10" fill="#9a6700" text-anchor="start">←TTL 你漏了</text>

    <line x1="335" y1="245" x2="645" y2="245" stroke="#d0d5dd" stroke-width="1.5"/>
    <text x="490" y="268" font-size="12" font-weight="bold" fill="#cf222e" text-anchor="middle">写路径 ✗ 你今天漏的半边</text>
    <rect x="360" y="280" width="96" height="30" rx="6" fill="#ffffff" stroke="#57606a"/>
    <text x="408" y="299" font-size="11.5" fill="#1f2328" text-anchor="middle">更新数据库</text>
    <line x1="456" y1="295" x2="492" y2="295" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="474" y="289" font-size="9.5" fill="#57606a" text-anchor="middle">先…再</text>
    <rect x="496" y="280" width="80" height="30" rx="6" fill="#ffebe9" stroke="#cf222e"/>
    <text x="536" y="299" font-size="11.5" font-weight="bold" fill="#cf222e" text-anchor="middle">删除缓存</text>
    <text x="490" y="330" font-size="10.5" fill="#57606a" text-anchor="middle">删除而非更新：并发写会互相覆盖旧值，</text>
    <text x="490" y="346" font-size="10.5" fill="#57606a" text-anchor="middle">删掉后等下次读时懒加载回填，数据天然收敛</text>
    <text x="490" y="362" font-size="10.5" fill="#57606a" text-anchor="middle">顺序：先更新库，再删缓存</text>
</svg>